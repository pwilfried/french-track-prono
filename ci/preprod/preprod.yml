# To move to .github/workflows/preprod.yml (an agent cannot push workflow files: see #634).
name: Pre-production

# Every merge into main goes to pre-production (#634): its migrations on the pre-production
# Supabase project, the public seed, then the commit deployed on the pre-production Vercel project
# (https://french-track-preprod.vercel.app, kept out of search engines). Production is untouched:
# it still follows the vX.Y.Z tags (migrations.yml), set after the owner's go (ci/agents/release.sh,
# which also waits for this workflow to be green on main).
# Secrets (GitHub > Settings > Environments > preprod, never the production ones):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF,
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (docs/SETUP.md, « Préproduction »).
# Pre-production holds invented data only: no production export, no production secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits for the running one, then replaces the queued one.
concurrency:
  group: preprod
  cancel-in-progress: false

env:
  # The pre-production project: a production secret copied here by mistake is refused.
  PREPROD_PROJECT_REF: flezuosnpafwcnoubdiu
  PREPROD_URL: https://french-track-preprod.vercel.app

jobs:
  database:
    name: Migrations and seed of pre-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preprod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check what is deployed and where
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            *) echo "::error::Only main goes to pre-production, not $GITHUB_REF."; exit 1 ;;
          esac
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF are needed in the preprod environment."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "$PREPROD_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not the pre-production project: nothing applied."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to skip the flaky `releases/latest` GitHub API call that 503s.
          version: 3.0.0

      - name: Link the pre-production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # A failure stops here: the site is not deployed ahead of its schema.
      - name: Apply the migrations
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      # Public data only, idempotent (on conflict do nothing): what the owner adds by hand stays.
      - name: Load the seed
        run: ci/preprod/load-sql.sh supabase/seed.sql

  deploy:
    name: Deploy to Vercel pre-production
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preprod
      url: ${{ env.PREPROD_URL }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check the Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are needed in the preprod environment."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The pre-production project's own variables (its Supabase, its address), then noindex.
      - name: Pull the pre-production settings
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          echo "NEXT_PUBLIC_SITE_NOINDEX=1" >> .vercel/.env.production.local

      - name: Build
        env:
          NEXT_PUBLIC_SITE_NOINDEX: "1"
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Smoke test of pre-production
        run: scripts/smoke.sh "$PREPROD_URL"
