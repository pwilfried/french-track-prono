# To move to .github/workflows/preprod.yml (an agent cannot push workflow files: see #634).
name: Pre-production

# Every merge into main goes to pre-production (#634): its migrations on the pre-production
# Supabase project, the public seed, then the commit deployed on the pre-production Vercel project
# (https://french-track-preprod.vercel.app, kept out of search engines). Production is untouched:
# it still follows the vX.Y.Z tags (migrations.yml), set automatically by ci/agents/release.sh once
# a milestone is finished; a failed run of this workflow on main's commit makes the tag wait.
# Secrets (GitHub > Settings > Environments > preprod, never the production ones):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF,
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (docs/SETUP.md, « Préproduction »).
# Pre-production holds invented data only: no production export, no production secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits for the running one, then replaces the queued one.
concurrency:
  group: preprod
  cancel-in-progress: false

env:
  # The pre-production project: a production secret copied here by mistake is refused.
  PREPROD_PROJECT_REF: flezuosnpafwcnoubdiu
  PREPROD_URL: https://french-track-preprod.vercel.app

jobs:
  database:
    name: Migrations and seed of pre-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preprod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check what is deployed and where
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            *) echo "::error::Only main goes to pre-production, not $GITHUB_REF."; exit 1 ;;
          esac
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF are needed in the preprod environment."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "$PREPROD_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not the pre-production project: nothing applied."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to skip the flaky `releases/latest` GitHub API call that 503s.
          version: 3.0.0

      - name: Link the pre-production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # A failure stops here: the site is not deployed ahead of its schema.
      - name: Apply the migrations
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      # Public data only, idempotent (on conflict do nothing): what the owner adds by hand stays.
      - name: Load the seed
        run: ci/preprod/load-sql.sh supabase/seed.sql

  deploy:
    name: Deploy to Vercel pre-production
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preprod
      url: ${{ env.PREPROD_URL }}
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check the Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are needed in the preprod environment."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The pre-production project's own variables (its Supabase, its address), plus noindex; then
      # the same checked deploy as production, rollback included (ci/vercel-deploy.sh, #720).
      - name: Deploy and smoke-test pre-production
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTS_OWNER: ${{ vars.AGENTS_OWNER }}
          NEXT_PUBLIC_SITE_NOINDEX: "1"
          VERCEL_EXTRA_ENV: NEXT_PUBLIC_SITE_NOINDEX=1
        run: ci/vercel-deploy.sh "$PREPROD_URL"

  e2e:
    name: End-to-end tests against pre-production
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preprod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLIC_CACHE_FLUSH_SECRET: ${{ secrets.PUBLIC_CACHE_FLUSH_SECRET }}
    steps:
      - name: Check the e2e secrets
        run: |
          if [ "$SUPABASE_PROJECT_REF" != "$PREPROD_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not the pre-production project: no test run."
            exit 1
          fi
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://$PREPROD_PROJECT_REF.supabase.co" ]; then
            echo "::error::SUPABASE_URL must be https://$PREPROD_PROJECT_REF.supabase.co."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$PUBLIC_CACHE_FLUSH_SECRET" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY and PUBLIC_CACHE_FLUSH_SECRET are needed in the preprod environment."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No retry, as in the CI of a PR. The global teardown deletes the run's accounts.
      - name: Run the e2e suite against pre-production
        id: e2e
        run: E2E_BASE_URL="$PREPROD_URL" npx playwright test

      # Again, even if the run was cut short before its teardown (#695).
      - name: Delete the test accounts, leagues and competitions
        if: always()
        run: ci/preprod/load-sql.sh ci/preprod/cleanup-e2e.sql

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprod-playwright-report
          path: playwright-report
          retention-days: 14

      - name: Write the result in the validation issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$OUTCOME" = success ]; then verdict="✅ verts"; else verdict="❌ rouges ($OUTCOME)"; fi
          body="Tests e2e contre la préprod sur \`${GITHUB_SHA:0:7}\` : $verdict. Rapport : $run_url (artefact \`preprod-playwright-report\`)."
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'Valider in:title' \
            --json number,title --jq '[.[] | select(.title | test("^Valider v[0-9.]+ en préprod"))][0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            echo "No open « Valider vX.Y.Z en préprod » issue: the result stays in this run."
          fi
