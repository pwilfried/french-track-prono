name: agents

# Claude Code on issues and PRs, started by an owner only (repository variable AGENTS_OWNER),
# or by the workflows acting as an owner through AGENTS_PAT:
#   - "@claude …" in a comment, a review, or a new issue's body;
#   - the label agent:claude on an issue (agents-merge.yml puts it on the next agent:ready issue).
# agents-merge.yml then merges the green PRs and starts the next issue. See ci/agents/README.md.
# GitHub-hosted runners (public repository). Claude runs on the plan of CLAUDE_CODE_OAUTH_TOKEN
# (or on API billing with ANTHROPIC_API_KEY).
# The repository is public: route.sh ignores everyone who is not an owner, and comments written by
# github-actions never start a run.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

env:
  AGENTS_OWNER: ${{ vars.AGENTS_OWNER }}
  # Issue or PR number, whatever the event.
  NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  route:
    # Cheap filter; route.sh checks the author and decides.
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude')) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      claude: ${{ steps.route.outputs.claude }}
      auto: ${{ steps.route.outputs.auto }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: route
        env:
          BOT_TOKEN: ${{ github.token }}
          PAT_TOKEN: ${{ secrets.AGENTS_PAT || github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
          SENDER: ${{ github.event.sender.login }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ci/agents/route.sh

  claude:
    needs: route
    if: needs.route.outputs.claude == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: agents-claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # Claude GitHub App token (OIDC)
      actions: read # lets Claude read CI results on a PR
    steps:
      # The latest main, not the one of the event: a run queued behind others would otherwise
      # start from an old main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ !(github.event.issue.pull_request || github.event.pull_request) && github.event.repository.default_branch || '' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: claude
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          label_trigger: agent:claude
          branch_prefix: "claude/"
          claude_args: >-
            --model claude-opus-5-5 --effort medium --allowedTools "Bash(npm run:*),Bash(npm test:*),Bash(npx vitest:*),Bash(npx prettier:*),Bash(npx eslint:*),Bash(npx tsc:*),Bash(git merge:*),Bash(git fetch:*),Bash(cd:*)"
      # Claude only pushes a branch for an issue; open its PR (as an owner, so that the CI runs).
      - id: pr
        if: steps.claude.outcome == 'success' && steps.claude.outputs.branch_name != '' && github.event.issue.number && !github.event.issue.pull_request
        env:
          BOT_TOKEN: ${{ github.token }}
          PAT_TOKEN: ${{ secrets.AGENTS_PAT || github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          TITLE: ${{ github.event.issue.title }}
          BASE: ${{ github.event.repository.default_branch }}
        run: ci/agents/open-pr.sh claude
      - if: always()
        env:
          BOT_TOKEN: ${{ github.token }}
          PAT_TOKEN: ${{ secrets.AGENTS_PAT || github.token }}
          STATUS: ${{ steps.claude.outcome }}
          LOG: ${{ steps.claude.outputs.execution_file }}
          PR: ${{ steps.pr.outputs.number }}
          KIND: ${{ (github.event.pull_request.number || github.event.issue.pull_request) && 'pr' || 'issue' }}
          AUTO: ${{ needs.route.outputs.auto }}
        run: |
          MESSAGE=$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$LOG" 2>/dev/null || true)
          export MESSAGE
          ci/agents/after-agent.sh
