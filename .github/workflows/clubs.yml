name: Clubs import

# #339: the athletics clubs, from the State's company API, into the production `clubs` table.
# Every month, or by hand from the Actions tab. One row per SIREN: running it again only
# refreshes names and towns. Uses the same secrets as "Database migrations".
on:
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    name: Import the athletics clubs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch
        run: node scripts/clubs/fetch.mjs clubs.csv
      - name: Clean
        run: node scripts/clubs/import.mjs clubs.csv clubs-sql
      - uses: actions/upload-artifact@v4
        with:
          name: clubs
          path: |
            clubs.csv
            clubs-sql
      - name: Import into production
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::No production Supabase project configured: nothing imported."
            exit 0
          fi
          for file in clubs-sql/*.sql; do
            jq -Rs '{query: .}' "$file" > body.json
            curl -sS --fail-with-body -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @body.json
            echo
          done
