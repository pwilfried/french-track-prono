name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Vitest also runs the layer import rule (tools/layers.repo.test.ts).
      # No retry on failure: a flaky test is fixed or deleted, never rerun automatically.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Database (Supabase local, pgTAP, adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Starts the database and the REST API only (migrations + seed.sql are applied by the start).
      - name: Start local Supabase
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: pgTAP tests
        run: supabase test db

      - name: Install dependencies
        run: npm ci

      # The adapter tests read the local address and key from the environment.
      # REQUIRE_SUPABASE_TESTS makes the run fail instead of silently skipping them.
      - name: Adapter tests against local Supabase
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase.json"
          jq 'keys' "$RUNNER_TEMP/supabase.json"
          export NEXT_PUBLIC_SUPABASE_URL="$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' "$RUNNER_TEMP/supabase.json")"
          REQUIRE_SUPABASE_TESTS=1 npm test
