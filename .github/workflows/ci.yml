name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Vitest also runs the layer import rule (tools/layers.repo.test.ts).
      # No retry on failure: a flaky test is fixed or deleted, never rerun automatically.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Play functions of the stories run in a real browser (Chromium).
      - name: Install browser for Storybook tests
        run: npx playwright install --with-deps chromium

      - name: Storybook tests
        run: npm run test:storybook

      - name: Storybook build
        run: npm run build-storybook

  database:
    name: Database (Supabase local, pgTAP, adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Starts the database, the REST API, the auth service and the test mailbox (migrations + seed.sql
      # are applied by the start). The other services are not needed.
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: pgTAP tests
        run: supabase test db

      - name: Install dependencies
        run: npm ci

      # The adapter tests read the local address and key from the environment.
      # With some services excluded, `supabase status` prints no API key, so the key is built from
      # the documented default JWT secret of the local stack (local use only, never a real secret).
      # REQUIRE_SUPABASE_TESTS makes the run fail instead of silently skipping the tests.
      - name: Adapter tests against local Supabase
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase.json"
          export NEXT_PUBLIC_SUPABASE_URL="$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
          KEY="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY // empty' "$RUNNER_TEMP/supabase.json")"
          if [ -z "$KEY" ]; then
            KEY="$(node -e '
              const crypto = require("node:crypto");
              const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
              const body = b64({ alg: "HS256", typ: "JWT" }) + "." + b64({ iss: "supabase-demo", role: "anon", exp: 1983812996 });
              const sig = crypto.createHmac("sha256", "super-secret-jwt-token-with-at-least-32-characters-long").update(body).digest("base64url");
              console.log(body + "." + sig);
            ')"
          fi
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$KEY"
          REQUIRE_SUPABASE_TESTS=1 npm test

      # The reopen script is local test tooling; this keeps it working (twice in a row) after schema changes.
      - name: Local reopen script
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for i in 1 2; do psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/dev/open_events.sql; done
          RESULT="$(psql "$DB" -tA -c "select count(*) filter (where lock_at > now()) > 0 and count(*) filter (where lock_at <= now()) > 0 and (select count(*) from results) = 0 from events")"
          test "$RESULT" = "t"
