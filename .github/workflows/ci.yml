name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Vitest also runs the layer import rule (tools/layers.repo.test.ts).
      # No retry on failure: a flaky test is fixed or deleted, never rerun automatically.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Play functions of the stories run in a real browser (Chromium).
      # No --with-deps: ubuntu-latest already has every system lib headless Chromium needs,
      # and apt-get on the runner is flaky when the Ubuntu mirrors are down (see #461).
      - name: Install browser for Storybook tests
        run: npx playwright install chromium

      - name: Storybook tests
        run: npm run test:storybook

      - name: Storybook build
        run: npm run build-storybook

  database:
    name: Database (Supabase local, pgTAP, adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The local Supabase ports are in Linux's ephemeral range: an outgoing connection (the image
      # pulls of `supabase start`) can hold one when the database binds it (#580). Reserve them.
      - name: Reserve the local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to skip the flaky `releases/latest` GitHub API call that 503s.
          version: 3.0.0

      # Never fails the build: only warns when a newer stable CLI than the pinned one exists.
      - name: Check for a newer Supabase CLI
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo supabase/cli --json tagName --jq .tagName)"
          current="$(supabase --version)"
          if [ "${latest#v}" != "$current" ]; then
            echo "::warning::Supabase CLI $latest is out, the CI is pinned to $current: bump \`version:\` in ci.yml and migrations.yml."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Starts the database, the REST API, the auth service and the test mailbox (migrations + seed.sql
      # are applied by the start). The other services are not needed.
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: pgTAP tests
        run: supabase test db

      # Static checks of the SQL functions (plpgsql_check): fails on errors, not on warnings.
      - name: Database lint
        run: supabase db lint --level error --fail-on error

      - name: Install dependencies
        run: npm ci

      # The adapter tests and the end-to-end test read the local address and key from the environment.
      - name: Local Supabase environment
        run: ci/supabase-env.sh

      # REQUIRE_SUPABASE_TESTS makes the run fail instead of silently skipping the tests.
      - name: Adapter tests against local Supabase
        run: |
          # The prediction contract needs open events, and reopening removes the results the event
          # reader test relies on: run it last, after reopening.
          REQUIRE_SUPABASE_TESTS=1 npm test -- --exclude src/infra/prediction-repository.contract.test.ts
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/dev/open_events.sql
          REQUIRE_SUPABASE_TESTS=1 npm test -- src/infra/prediction-repository.contract.test.ts

      # The reopen script is local test tooling; this keeps it working (twice in a row) after schema changes.
      - name: Local reopen script
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for i in 1 2; do psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/dev/open_events.sql; done
          # Only the Ultimate Championship is reopened: other tests create events in competitions of their own.
          RESULT="$(psql "$DB" -tA -c "select count(*) filter (where e.lock_at > now()) > 0 and count(*) filter (where e.lock_at <= now()) > 0 and count(r.event_id) = 0 from events e join competitions c on c.id = e.competition_id left join results r on r.event_id = e.id where c.slug = 'ultimate-championship-2026'")"
          test "$RESULT" = "t"

      # Demo players (local test tooling): twelve players, 24 predictions, idempotent.
      - name: Local demo players script
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for i in 1 2; do psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/dev/demo_players.sql; done
          RESULT="$(psql "$DB" -tA -c "select count(*) from predictions p join auth.users u on u.id = p.user_id where u.email like 'demo-%@example.test'")"
          test "$RESULT" = "24"

      # One-command points check (local test tooling): demo players, then the two events locked.
      - name: Local points check script
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/dev/open_events.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/dev/demo_players.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/dev/lock_demo_events.sql

      # End-to-end journey (Playwright) on the production build. The events are open after the
      # reopen script above. No retry: see playwright.config.ts.
      # No --with-deps: ubuntu-latest already has every system lib headless Chromium needs,
      # and apt-get on the runner is flaky when the Ubuntu mirrors are down (see #461).
      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      # A test push key (its private half was thrown away): the notifications button shows up.
      - name: Build the app
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BLPG-ATns5ecNrsztBZUK5mdAxlPfYsSMPkz24H7SBxl4RTTpZHGYMLX60hboJ2uWQhiXiZCv68QAg-x8V4TjqA
        run: npm run build

      # The pages follow the next competition by date; the tests create competitions of their own,
      # so the journeys are pinned on the seeded Ultimate Championship.
      - name: End-to-end test
        env:
          COMPETITION_SLUG: ultimate-championship-2026
        run: npm run test:e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
