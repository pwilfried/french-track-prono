name: Database migrations

# The production schema follows the repository, never by hand (issue #170):
#   * a pushed `vX.Y.Z` tag applies the migrations to the production project, then deploys that
#     commit to Vercel production (#405): the code never runs ahead of its schema;
#   * a pull request touching `supabase/migrations` shows what would be applied (dry run).
# Secrets (GitHub > Settings > Secrets and variables > Actions, environment "production"):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF,
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (docs/SETUP.md, « Déploiements Vercel »),
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY (push notifications, docs/SETUP.md, « Notifications push »).
# A missing Supabase secret fails the production run: deploying the code without its schema would
# put them out of step. The dry run of a PR only says so (a fork's PR has no secrets).
# Migrations apply a minute or two before the new code is live (longer if the deploy fails): they
# must work with the version already in production (docs/SETUP.md, « Migrations rétrocompatibles »).

on:
  push:
    tags: ["v*.*.*"]
  # Run by hand from the Actions tab (or the API): main's migrations, then main deployed.
  workflow_dispatch:
  pull_request:
    paths: ["supabase/migrations/**"]

permissions:
  contents: read

# One production release at a time, in the order they were started; PR dry runs apart.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('migrations-dry-run-{0}', github.ref) || 'production' }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry run against production
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the production secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::No production Supabase secrets here (a fork's PR): no dry run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          # Pinned to skip the flaky `releases/latest` GitHub API call that 503s.
          version: 3.0.0

      - name: Link the production project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show the migrations that would be applied
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD"

  apply:
    name: Apply migrations to production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      # Only main or a version tag goes to production, never a work branch picked in "Run workflow".
      - name: Check what is released
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *) echo "::error::Only main or a vX.Y.Z tag can go to production, not $GITHUB_REF."; exit 1 ;;
          esac

      - name: Check the production secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF are needed: no deploy without the schema."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to skip the flaky `releases/latest` GitHub API call that 503s.
          version: 3.0.0

      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply the migrations
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      # #502: the Edge Function that sends the push notifications, called every minute by pg_cron.
      # A new secret at each release: in the function's secrets first, then in Vault (read by
      # pg_cron). Without the VAPID keys nothing is deployed, and pg_cron calls nothing.
      # A failure here must not keep the site out of step with its schema: the notifications wait,
      # the deploy goes on, and the warning stays on the run.
      - name: Deploy the push notifications
        continue-on-error: true
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::notice::No VAPID keys: the push notifications are not deployed."
            exit 0
          fi
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          # CLI v3 asks before changing a hosted project unless --yes is given: the job has no terminal.
          supabase functions deploy push-notifications --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes \
            PUSH_CRON_SECRET="$secret" VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY"
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/push-notifications"
          # Both values are hex or a project ref: no quote to escape in the SQL literals.
          sql="select private.push_set_secrets('$url', '$secret')"
          jq -n --arg sql "$sql" '{query: $sql}' |
            curl --fail-with-body -sS -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data-binary @- > /dev/null

  # Merges into main no longer deploy (vercel.json): production follows the tags, after the schema.
  deploy:
    name: Deploy to Vercel production
    needs: apply
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Optional (#195): with them the build uploads its source maps to Sentry (docs/sentry.md).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      # Unlike the migrations, a missing secret fails: production would silently stop moving.
      - name: Check the Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are needed (docs/SETUP.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The production environment variables come from the Vercel project, as for a Git deploy.
      - name: Pull the production settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # A CLI deploy creates no GitHub deployment, so the smoke workflow is not triggered: run it here.
      - name: Smoke test of production
        run: scripts/smoke.sh https://www.frenchtrackprono.com
