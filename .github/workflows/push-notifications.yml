name: Push notifications

# #203: sends the push notifications due (reminder before a lock, points once computed), by hand
# from the Actions tab. In production, pg_cron calls the Edge Function `push-notifications` every
# minute (#502): a GitHub schedule runs late or not at all when GitHub is busy.
# Secrets (environment "production"): SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF (as for the
# migrations), VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-notifications

jobs:
  push:
    name: Send the push notifications due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/push-notifications.mjs
