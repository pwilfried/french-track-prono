name: Push notifications

# #203: sends the push notifications due (reminder before a lock, points once computed). Every
# 5 minutes (GitHub may run it a few minutes late: a reminder is sent up to 20 minutes before the
# lock), or by hand from the Actions tab. Secrets (environment "production"): SUPABASE_ACCESS_TOKEN,
# SUPABASE_PROJECT_REF (as for the migrations), VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-notifications

jobs:
  push:
    name: Send the push notifications due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/push-notifications.mjs
